<oe-flat-widget [title]="title">
  <!-- mrdomek Click handling is implemented on a plain div to avoid relying on oe-flat-widget inputs -->
  <div class="hm-click-area" role="button" tabindex="0" (click)="presentModal()" (keydown.enter)="presentModal()"
    (keydown.space)="presentModal()">
    <div class="hm-header">
      <oe-flat-widget-line name="Serial" [channelAddress]="getSerialAddress()"></oe-flat-widget-line>

      <oe-flat-widget-line class="hm-ac-line" name="AC Power" [channelAddress]="getAcPowerAddress()"
        [converter]="toWattString"></oe-flat-widget-line>

      <div class="hm-dc-total">
        <div class="hm-dc-total-label">DC Total</div>
        <div class="hm-dc-total-value">
          {{ getDcTotalPowerW() === null ? "-" : (getDcTotalPowerW() | number:'1.0-0') }}
          <span class="hm-unit">W</span>
        </div>
      </div>
    </div>

    <!-- mrdomek Table layout to force reliable separators -->
    <div class="hm-table-wrap">
      <table class="hm-table" aria-label="Hoymiles DC Inputs">
        <colgroup>
          <col class="hm-col-pv" />
          <col class="hm-col-pv" />
          <col class="hm-col-sum" />
        </colgroup>

        <tbody>
          <ng-container *ngFor="let left of inputs; let i = index">
            <tr *ngIf="i % 2 === 0" class="hm-tr">

              <!-- PV left -->
              <td class="hm-td hm-td-pv">
                <div class="hm-pv-title">{{ inputs[i].label }}</div>

                <!-- mrdomek Util (%) label removed; keep only the bar -->
                <oe-flat-widget-percentagebar class="hm-bar"
                  [channelAddress]="getUtilizationAddress(inputs[i])"></oe-flat-widget-percentagebar>

                <oe-flat-widget-line name="Power" [channelAddress]="getPowerAddress(inputs[i])"
                  [converter]="toWattString"></oe-flat-widget-line>
              </td>

              <!-- PV right -->
              <td class="hm-td hm-td-pv">
                <div class="hm-pv-title">{{ inputs[i + 1]?.label }}</div>

                <!-- mrdomek Util (%) label removed; keep only the bar -->
                <oe-flat-widget-percentagebar class="hm-bar"
                  [channelAddress]="getUtilizationAddress(inputs[i + 1])"></oe-flat-widget-percentagebar>

                <oe-flat-widget-line name="Power" [channelAddress]="getPowerAddress(inputs[i + 1])"
                  [converter]="toWattString"></oe-flat-widget-line>
              </td>

              <!-- MPPT Sum -->
              <td class="hm-td hm-td-sum">
                <div class="hm-sum-title">{{ getMpptSumLabel(i) }}</div>

                <div class="hm-sum-value">
                  {{ getPairPowerSumW(i) === null ? "-" : (getPairPowerSumW(i) | number:'1.0-0') }}
                  <span class="hm-unit">W</span>
                </div>
              </td>

            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>

    <div class="hm-alarms">
      <oe-flat-widget-line name="Alarm Summary" [channelAddress]="getAlarmSummaryAddress()"></oe-flat-widget-line>

      <oe-flat-widget-line name="Alarm Info" [channelAddress]="getAlarmSummaryInfoAddress()"></oe-flat-widget-line>

      <oe-flat-widget-line name="Alarm Ignored"
        [channelAddress]="getAlarmSummaryIgnoredAddress()"></oe-flat-widget-line>
    </div>
  </div>
</oe-flat-widget>
